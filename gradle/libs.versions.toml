[versions]
agp = "9.4.1"
kotlin = "2.4.20"
kotlinxAtomicfu = "0.33.0"
kotlinxCoroutines = "1.11.0"
kotlinxDateTime = "0.8.0"
kotlinxSerialization = "1.11.0"
ktor = "3.6.0"

jetbrainsCompose = "1.12.1" # https://github.com/JetBrains/compose-multiplatform/releases
jetbrainsLifecycleViewModelNavigation3 = "2.11.0"
jetbrainsMaterialIcons = "1.7.3"
jetbrainsMaterial3 = "1.12.0-alpha03"
jetbrainsSavedstate = "1.4.0"

androidxNavigation3 = "1.0.1"

android-compileSdk = "37"
android-minSdk = "26"
assertk = "0.28.1"

dbtoolsKmpCommons = "1.9.0"
detekt = "2.0.0-alpha.6"
downloadPlugin = "5.7.0"
kover = "0.9.11"
vanniktechPlugin = "0.37.0"
versionsPlugin = "0.65.0"

[plugins]
android-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
download = { id = "de.undercouch.download", version.ref = "downloadPlugin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "jetbrainsCompose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
vanniktechPublishing = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechPlugin" }
versions = { id = "io.github.ben-manes.versions", version.ref = "versionsPlugin" }

[libraries]
dbtools-kmp-commons = { group = "org.dbtools.kmp", name = "kmp-commons", version.ref = "dbtoolsKmpCommons" }

jetbrains-compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "jetbrainsCompose" }
jetbrains-compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "jetbrainsCompose" }
jetbrains-compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "jetbrainsCompose" }
jetbrains-compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "jetbrainsMaterial3" }
jetbrains-lifecycle-viewmodel-navigation3 = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "jetbrainsLifecycleViewModelNavigation3" }
jetbrains-savedstate-compose = { group = "org.jetbrains.androidx.savedstate", name = "savedstate-compose", version.ref = "jetbrainsSavedstate" }
jetbrains-material-icons = { group = "org.jetbrains.compose.material", name = "material-icons-core", version.ref = "jetbrainsMaterialIcons" }

androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "androidxNavigation3" }

ktor-http = { group = "io.ktor", name = "ktor-http", version.ref = "ktor" }

kotlin-atomicfu = { group = "org.jetbrains.kotlinx", name = "atomicfu", version.ref = "kotlinxAtomicfu" }
kotlin-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlin-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlin-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDateTime" }
kotlin-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }

assertk = { group = "com.willowtreeapps.assertk", name = "assertk", version.ref = "assertk" }
